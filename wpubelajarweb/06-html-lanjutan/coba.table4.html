<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>marging table</title>
</head>

<body>
  <table border="1" cellspacing="0" cellpadding="5">
    
    <tr>
      
      <td rowspan="3">1,1-2,1-3-1</td>
      <td colspan="2">1,2 & 1,3</td>
      
    </tr>
    <tr>
      
      <td>2,2</td>
      <td>2,3</td>
      
    </tr>
    <tr>
      
      <td>3,1</td>
      <td>3,3</td>
    </tr>
  </table>
</body>

</html>
