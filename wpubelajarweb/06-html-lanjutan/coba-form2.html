<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contoh input atribut, checkbox dan radio</title>
</head>

<body>
  
  <h1>Contoh input atribut, checkbox dan radio</h1>
  
  <form>
<label for="Name">Nama:

<input type="text" name="Nama" id="Nama" placeholder="Masukan nama" autocomplete="off" autofocus required/>
  
</label>
<br />

<label for="hobby1">Olahraga

<input type="checkbox" name="hobby1" id="hobby1" value="Olahraga" checked/>

</label>
<br />
<label for="hobby2">Ngoding

<input type="checkbox" name="hobby2" id="hobby2" value="Ngoding" />

</label>


<h3>jenis kelamin</h3>

<br />

<label for="Pria">
  
  <input type="radio" name="jenis_kelamin" id="Pria" value="Pria" checked />Pria
  
</label>
 <br />
 
 <label for="Wania">
   
   <input type="radio" name="jenis_kelamin" id="Wanita" value="Wanita" />Wanita
   
 </label>

<br />

<button type="submit">kirim</button>

  </form>
  
  
</body>

</html>
