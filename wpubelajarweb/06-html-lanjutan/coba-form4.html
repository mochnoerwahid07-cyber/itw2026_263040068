<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>coba form html</title>
</head>

<body>
  <h1>coba elemen form didalam tabel</h1>
  
  <form>
    
    <table>
      <tr>
        
        <td align="right">  <label for="nama">Nama:
  </label></td>
  
        <td>
              <input type="text" name="Nama" id="Nama" placeholder="masukan nama" />

        </td>
        
      </tr>
      <tr>
        
        <td align="right">
            <label for="password">Sandi:
  </label>
        </td>
        
        <td>
          <input type="password" name="Sandi" id="Sandi" placeholder="masukkan sandi"/>

        </td>
        
      </tr>
      <tr>
        
        <td align="right">
            <label for="email">Email:
  </label>
        </td>
        
        <td>
          <input type="email" name="email" id="email" placeholder="masukkan email" />

        </td>
        
      </tr>
      <tr>
        
        <td  align="right">
            <label for="Umur">Umur:
  </label>
        </td>
        
        <td>
          <input type="number" name="Umur" id="umur" min="0" max="100" step="5" />

        </td>
        
      </tr>
      <tr>
        
        <td align="right">
            <label for="tanggal">Tanggal:
  </label>
        </td>
        
        <td align="right">
          <input type="date" name="Tanggal" id="Tanggal" placeholder="Masukkan tanggal" />

        </td>
        
      </tr>
      <tr>
        
        <td align="right">
            <label for="Warna">Warna:
  </label>
        </td>
        
        <td>
              <input type="collor" name="Warna" id="Warna" placeholder="Pilih Warna" />

        </td>
        
      </tr>
      <tr>
        
        <td></td>
        <td><button type="submit">kirim</button>
</td>
      </tr>
    </table>
    
</body>

</html>
