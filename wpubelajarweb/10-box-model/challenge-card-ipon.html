<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone 17 Pro Max Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ff6a00;
      font-family: Arial, Helvetica, sans-serif;
      padding: 40px;
    }

    .product-card {
      background-color: #fff;
      width: 330px;
      margin: 0 auto;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 10px 20px rgb(0 0 0 / 0.1);
    }

    .product-image {
      width: 100%;
      height: 220px;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 20px;
      background-color: #f9f9f9;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-category {
      font-size: 12px;
      color: #ff6a00; /* Warna aksen oranye */
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-title {
      font-size: 22px;
      font-weight: bold;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .product-description {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .price-section {
      margin-bottom: 20px;
    }

    .price-section .price {
      font-size: 24px;
      color: #000;
      font-weight: bold;
    }

    .price-section .original-price {
      font-size: 14px;
      color: #999;
      text-decoration: line-through;
      margin-left: 8px;
    }

    .size-options-wrapper {
      border: none;
    }

    .size-label-text {
      font-size: 13px;
      color: #333;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .size-options {
      margin-bottom: 25px;
    }

    .size-options input[type="radio"] {
      display: none;
    }

    .size-options label {
      display: inline-block;
      padding: 0 12px; /* Disesuaikan agar teks GB/TB muat */
      height: 44px;
      border: 2px solid #eee;
      text-align: center;
      line-height: 40px;
      margin-right: 6px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.3s ease;
    }

    .size-options input[type="radio"]:checked+label {
      background-color: #ff6a00;
      border-color: #ff6a00;
      color: #fff;
      
    }

    .buy-button {
      width: 100%;
      padding: 16px;
      background-color: #ff6a00;
      color: white;
      border: none;
      border-radius: 10px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s ease;
      
    }

    .buy-button:hover {
      background-color: #e65f00;
      
    }
  </style>
</head>

<body>
  <article class="product-card">
    <figure class="product-image">
      
      <img src="https://images.unsplash.com/photo-1763891378295-5d9bd5c48745?q=80&w=1527&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
        alt="iPhone 17 Pro Max Orange">
    </figure>

    <p class="product-category">Apple</p>
    <h3 class="product-title">iPhone 17 Pro Max</h3>

    <p class="product-description">Hadir dengan balutan warna oranye eksklusif. Ditenagai chip A19 Pro terbaru, layar Super Retina XDR yang memukau, dan ketahanan baterai luar biasa.</p>

    <div class="price-section">
      <span class="price">IDR 24.999.000</span>
      <del class="original-price">IDR 26.999.000</del>
    </div>

    <form action="">
      <fieldset class="size-options-wrapper">
        <legend class="size-label-text">Pilih Kapasitas:</legend>
        <div class="size-options">
          <input type="radio" name="capacity" id="c256" value="256" checked>
          <label for="c256">256GB</label>

          <input type="radio" name="capacity" id="c512" value="512">
          <label for="c512">512GB</label>

          <input type="radio" name="capacity" id="c1tb" value="1024">
          <label for="c1tb">1TB</label>
        </div>
      </fieldset>

      <button class="buy-button" type="submit">Tambahkan ke Keranjang</button>
    </form>
  </article>
</body>

</html>
