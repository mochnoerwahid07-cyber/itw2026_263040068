<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coba css font styling</title>
  
  <style>
  
  
  @import url('https://fonts.googleapis.com/css2?family=Playwrite+AR+Guides&display=swap');
  
  @font-face {
    font-family: Argentina;
    src: url("fonts/OFL.txt")
    format: ("truetype")}
    
  font-Argentina {
    
    font-family: Argentina, arial;
  }
    
    

  
  
  h1{
    color: brown ;
    font-size: 40px;
    font-family: "times new roman" , serif, arial ;
  }
  
  p {
    color: navy;
    font-size: 16px;
    font-family: Argentina, 'Times New Roman', Times, serif;
  }
    
  </style>
  
</head>

<body>
  <h1>hello world</h1>
  
  <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Consequuntur, aspernatur!</p>
  <br />
  <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Cum aperiam, excepturi deleniti quos suscipit ut distinctio odio sed facilis rem.</p>

</html>
