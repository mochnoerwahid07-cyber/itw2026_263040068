<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote Galau</title>
  
  <style>
    
    body {
      font-family: "Courir New", Courir, Monospace;
      font-weight: bold;
      color: gray;
      text-align: center;
      
    }
    
    h1 {
      font-size: 45;
      text-transform: uppercase;
      font-style: Italic;
      letter-spacing: 8px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: gray;
      text-shadow: 5px 5px 2px lightgrey;
      
    }
    
    .quote {
      font-size: 16px;
      line-height: 25px;
      word-spacing: 12px;
      
      
    }
    
    span {
      color: white;
      background-color:gray;
      
    }
    
    .Takopi {
      font-size: 10px;
      letter-spacing: 3px;
      color: pink;
      font-weight: normal;
    }
    
    Shizuka {
      color: black;
    }
    
    marina {
      color: gold;
    }
    
    a {
      text-decoration: line-through;
      
    }
    

    
  </style>
  
  
</head>

<body>
  
  <h1>Kebahagiaan</h1>
  
  <p class="quote">Tidak ada <a>alat ajaib</a> yang bisa <br />
  <span>langsung membuat seseorang bahagia</span>.
  <br /> Terkadang yang dibutuhkan hanyalah <br />
  pendengar yang baik</p>
  
  <p class="Takopi">-Takopi (Takopi's <shizuka>Original</Shizuka> <marina>Sin</marina>)-</p>
</body>

</html>
