<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote Galau</title>
  
  <style>
    
    body {
      font-family: "Courir New", Courir, Monospace;
      font-weight: bold;
      color: lightgrey;
      text-align: center;
      background-image: linear-gradient(to bottom, rgb(15 23 42/70%) 60%, rgb(15 23 42/10%)), url(https://fastly.picsum.photos/id/881/200/300.jpg?hmac=OaIsS2cuxcnUpCVdxcFoc8JwfJgzWEv2Z9F_qEN9tHU);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      
    }
    
    h1 {
      font-size: 40px;
      text-transform: uppercase;
      font-style: Italic;
      letter-spacing: 8px;
     background-image: linear-gradient( to right, black, gold)
     ;
     background-clip: text;
     color: transparent;
     filter: drop-shadow(0 0 8px pink);
     
    }
    
    .quote {
      font-size: 16px;
      line-height: 25px;
      word-spacing: 12px;
      background-color: rgb(255 255 255 / 10%);
      max-width: 400px;
      margin: auto;
      padding: 15px;
      border-radius: 5%;
      border: 1px, solid, rgb(255 255 255 / 10%);
      box-shadow: 0 0 20px rgb(0 0 0 / 50%);
      
      
    }
    
    span {
      color: black;
      background-color:gold;
      
    }
    
    .Takopi {
      font-size: 10px;
      letter-spacing: 3px;
      color: pink;
      font-weight: normal;
      text-transform: uppercase;
    border-top: 2px solid rgb(255 255 255 /30%);
    width: 85%;
    margin: 30px auto;
    padding-top: 10px;
    
    
    
    }
    
    Shizuka {
      color: black;
    }
    
    marina {
      color: gold;
    }
    
    a {
     
      color: pink;
      text-shadow: 0 0 20px pink;
      
    }
    

    
  </style>
  
  
</head>

<body>
  
  <h1>Kebahagiaan</h1>
  
  <p class="quote">Tidak ada <a>alat ajaib</a> yang bisa <br />
  <span>langsung membuat seseorang bahagia</span>.
  <br /> Terkadang yang dibutuhkan hanyalah <br />
  pendengar yang baik</p>
  
  <p class="Takopi">-Takopi (Takopi's <shizuka>Original</Shizuka> <marina>Sin</marina>)-</p>
</body>

</html>
