<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS simpel selector</title>
  <style>
  
  /* Universal selector*/
  *{
    box-sizing: Border-box;
    font-family: arial, Helvetica;
    
    
  }
  /*type selector/ tag */
  
  h3 {
    color navy
  }
  
  /* class selector*/
  
  . highlight {
    
    background-color: khaki;
    font-weight: bold;
    
  }
  
  #heading {
    
    color: white;
    background-color: red;
    text-align: center;
    
    
  }
  
  /* grouping*/
  
  i, span {
    color: gray;
    
    
  }
  
/*  atribut selector */
  
  
  input[type="text"] {
    border: 2px solid blue;
    
  }
  
  
  a[href] {
    
    color green   
    
  }
  
  
  
    
  </style>
  
  
</head>

<body>
  
</body>

</html>
